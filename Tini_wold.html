<!-- 10/05/2026 - First-person 3D prototype: sky, ground, and a simple raycast world, without enemies yet. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tini_wold 3D</title>
  <style>
    :root {
      --bg: #08130d;
      --panel: rgba(10, 18, 14, 0.65);
      --panel-line: rgba(120, 180, 135, 0.32);
      --text: #edf9ef;
      --accent: #8ce8b1;
      --gold: #f4d878;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: block;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #87c9ff;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(340px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      z-index: 10;
      pointer-events: none;
    }

    .title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
    }

    .message {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--panel-line);
      font-size: 12px;
      color: #dff8e3;
      min-height: 18px;
    }

    .crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9;
      opacity: 0.8;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
    }

    .crosshair::before {
      width: 2px;
      height: 18px;
      left: 8px;
      top: 0;
    }

    .crosshair::after {
      width: 18px;
      height: 2px;
      left: 0;
      top: 8px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="title">Tini_wold 3D</div>
    <div class="stats">
      <div>Pos: <span id="pos">0,0</span></div>
      <div>Yaw: <span id="yaw">0°</span></div>
      <div>World: <span id="world">Open</span></div>
      <div>Status: <span id="status">Awake</span></div>
    </div>
    <div id="message" class="message">Move with W/A/S/D and look around.</div>
  </div>

  <div class="crosshair" aria-hidden="true"></div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const keys = {};
      let pointerLocked = false;

      const map = [
        '################',
        '#..............#',
        '#..###.........#',
        '#......#.......#',
        '#......#.......#',
        '#....##........#',
        '#..............#',
        '#..............#',
        '#...##.........#',
        '#..............#',
        '#.....##.......#',
        '#..............#',
        '#......##......#',
        '#..............#',
        '#..............#',
        '################'
      ];

      const player = {
        x: 3.5,
        y: 2.5,
        angle: 0,
        fov: Math.PI / 3,
        speed: 2.4,
        turnSpeed: 1.5
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function setMessage(text) {
        const msg = document.getElementById('message');
        if (msg) msg.textContent = text;
      }

      function updateHud() {
        document.getElementById('pos').textContent = `${player.x.toFixed(1)}, ${player.y.toFixed(1)}`;
        document.getElementById('yaw').textContent = `${((player.angle * 180 / Math.PI + 360) % 360).toFixed(0)}°`;
        document.getElementById('status').textContent = pointerLocked ? 'Looking' : 'Paused';
      }

      function isWall(x, y) {
        const cellX = Math.floor(x);
        const cellY = Math.floor(y);

        if (cellY < 0 || cellX < 0 || cellY >= map.length || cellX >= map[0].length) {
          return true;
        }

        return map[cellY][cellX] === '#';
      }

      function castRay(angle) {
        let distance = 0;
        const step = 0.02;

        while (distance < 18) {
          const testX = player.x + Math.cos(angle) * distance;
          const testY = player.y + Math.sin(angle) * distance;

          if (isWall(testX, testY)) {
            return distance;
          }

          distance += step;
        }

        return 18;
      }

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.55);
        sky.addColorStop(0, '#72c4ff');
        sky.addColorStop(0.55, '#dfeeff');
        sky.addColorStop(0.7, '#cde4ff');
        sky.addColorStop(1, '#f3d9a1');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.55);

        const sunY = canvas.height * 0.28;
        const sunX = canvas.width * 0.8;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 233, 138, 0.9)';
        ctx.arc(sunX, sunY, 52, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let i = 0; i < 14; i++) {
          const cloudX = ((i * 150 + (performance.now() * 0.02)) % (canvas.width + 200)) - 100;
          const cloudY = 60 + (i % 5) * 18;
          ctx.beginPath();
          ctx.arc(cloudX, cloudY, 22, 0, Math.PI * 2);
          ctx.arc(cloudX + 24, cloudY - 5, 20, 0, Math.PI * 2);
          ctx.arc(cloudX + 48, cloudY, 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGround() {
        const horizon = canvas.height * 0.5;
        const ground = ctx.createLinearGradient(0, horizon, 0, canvas.height);
        ground.addColorStop(0, '#4c7d43');
        ground.addColorStop(0.25, '#3f6937');
        ground.addColorStop(1, '#1a2a1d');
        ctx.fillStyle = ground;
        ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 12; i++) {
          const y = horizon + i * 36;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }

      function drawWorld() {
        const horizon = canvas.height * 0.5;
        const columnStep = 2;

        for (let x = 0; x < canvas.width; x += columnStep) {
          const rayAngle = player.angle - player.fov / 2 + (x / canvas.width) * player.fov;
          const distance = castRay(rayAngle);
          const corrected = distance * Math.cos(rayAngle - player.angle);
          const wallHeight = clamp((canvas.height * 0.8) / Math.max(corrected, 0.1), 0, canvas.height);
          const top = horizon - wallHeight / 2;
          const bottom = horizon + wallHeight / 2;

          const shade = clamp(1 - distance / 18, 0.2, 1);
          const r = Math.round(78 + shade * 120);
          const g = Math.round(96 + shade * 90);
          const b = Math.round(86 + shade * 90);

          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.fillRect(x, top, columnStep + 1, bottom - top);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        for (let i = 0; i < 20; i++) {
          const hillX = (i * 180 + (performance.now() * 0.02)) % (canvas.width + 220) - 110;
          ctx.beginPath();
          ctx.moveTo(hillX, horizon);
          ctx.quadraticCurveTo(hillX + 80, horizon - 60, hillX + 160, horizon);
          ctx.fill();
        }
      }

      function update(dt) {
        let moveX = 0;
        let moveY = 0;
        let turning = 0;

        if (keys['w'] || keys['ArrowUp']) {
          moveX += Math.cos(player.angle);
          moveY += Math.sin(player.angle);
        }
        if (keys['s'] || keys['ArrowDown']) {
          moveX -= Math.cos(player.angle);
          moveY -= Math.sin(player.angle);
        }
        if (keys['a']) {
          moveX += Math.cos(player.angle - Math.PI / 2);
          moveY += Math.sin(player.angle - Math.PI / 2);
        }
        if (keys['d']) {
          moveX += Math.cos(player.angle + Math.PI / 2);
          moveY += Math.sin(player.angle + Math.PI / 2);
        }
        if (keys['ArrowLeft']) turning -= 1;
        if (keys['ArrowRight']) turning += 1;

        player.angle += turning * player.turnSpeed * dt;

        if (moveX !== 0 || moveY !== 0) {
          const length = Math.hypot(moveX, moveY) || 1;
          const nextX = player.x + (moveX / length) * player.speed * dt;
          const nextY = player.y + (moveY / length) * player.speed * dt;

          if (!isWall(nextX, player.y)) player.x = nextX;
          if (!isWall(player.x, nextY)) player.y = nextY;
        }

        updateHud();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSky();
        drawGround();
        drawWorld();
      }

      function keyDown(event) {
        const key = event.key.toLowerCase();
        keys[key] = true;

        if (key === ' ') {
          if (document.pointerLockElement !== canvas) {
            canvas.requestPointerLock();
          }
        }
      }

      function keyUp(event) {
        keys[event.key.toLowerCase()] = false;
      }

      function mouseMove(event) {
        if (!pointerLocked) return;
        player.angle += event.movementX * 0.0026;
      }

      function pointerLockChange() {
        pointerLocked = document.pointerLockElement === canvas;
        updateHud();
      }

      function tick(timestamp) {
        const dt = Math.min((timestamp - (tick.last || timestamp)) / 1000, 0.033);
        tick.last = timestamp;

        update(dt);
        render();
        requestAnimationFrame(tick);
      }

      document.addEventListener('keydown', keyDown);
      document.addEventListener('keyup', keyUp);
      document.addEventListener('mousemove', mouseMove);
      document.addEventListener('pointerlockchange', pointerLockChange);
      window.addEventListener('resize', resize);

      resize();
      setMessage('Move with W/A/S/D and look around.');
      updateHud();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
